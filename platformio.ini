[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ ^6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Two app slots so the web UI can flash a new image over the air.
board_build.partitions = default_8MB.csv

; Both display libraries are linked in; only the detected one is instantiated.
lib_deps =
  marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
  olikraus/U8g2 @ ^2.35.9

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Iinclude/core
  -DCORE_DEBUG_LEVEL=1
  -Wall
  -Wextra
  -Wno-unused-parameter

test_ignore = test_tuning

; Desktop test harness for the tuning maths (include/core). Needs a host C++
; compiler only:  pio test -e native
[env:native]
platform = native
build_src_filter = -<*>
build_flags =
  -std=c++17
  -O2
  -Iinclude/core
  -Wall
test_build_src = no

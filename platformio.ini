[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ ^6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Two app slots so the web UI can flash a new image over the air.
board_build.partitions = default_8MB.csv

; Both display libraries are linked in; only the detected one is instantiated.
lib_deps =
  marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
  olikraus/U8g2 @ ^2.35.9

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -Wall
  -Wextra
  -Wno-unused-parameter
